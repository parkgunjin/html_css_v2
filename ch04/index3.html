<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        color: #222;
        background-color: aliceblue;
      }
      header {
        height: 62px;
        background-color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
      }
      .logo {
        font-size: 20px;
        color: #1a237e;
        font-weight: bold;
      }
      .logo span {
        color: skyblue;
      }
      nav {
        display: flex;
        gap: 30px;
      }
      nav a {
        text-decoration: none;
        color: #222;
        font-weight: bold;
        font-size: 14px;
      }
      .hero {
        height: 270px;
        background: linear-gradient(90deg, #202d87, #3949ab);
        color: white;
        flex-direction: column;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .hero h1 {
        margin: 15px;
        font-size: 40px;
      }
      .features {
        min-height: 378px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        padding: 40px 16px;
      }
      .card {
        width: 31%;
        max-width: 270px;
        height: 234px;
        background-color: white;
        border-radius: 10px;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        text-align: center;
        padding: 20px;

        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }
      .icon {
        font-size: 35px;
        margin: 15px;
      }
      .card h2 {
        font-weight: bold;
        font-size: 18px;
        margin: 10px;
        color: #3949ab;
      }
      .card p {
        font-size: 15px;
      }
      footer {
        height: 100px;
        background-color: #333333;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <header>
      <div class="logo">BRAND<span>LOGO</span></div>

      <nav>
        <a href="#">소개</a>
        <a href="#">서비스</a>
        <a href="#">문의하기</a>
      </nav>
    </header>

    <!-- Hero -->
    <section class="hero">
      <h1>더 나은 미래를 만드는 혁신</h1>
      <p>우리는 가장 단순한 방법으로 최고의 가치를 전달합니다.</p>
    </section>

    <!-- Features -->
    <section class="features">
      <div class="card">
        <div class="icon">🚀</div>
        <h2>빠른 속도</h2>
        <p>최신 기술을 활용하여 가장 빠른 퍼포먼스를 보장합니다.</p>
      </div>

      <div class="card">
        <div class="icon">💎</div>
        <h2>높은 품질</h2>
        <p>정교한 코드와 디자인으로 최상의 결과물을 제공합니다.</p>
      </div>

      <div class="card">
        <div class="icon">🤝</div>
        <h2>고객 신뢰</h2>
        <p>언제나 고객의 목소리에 귀 기울이며 함께 성장합니다.</p>
      </div>
    </section>

    <!-- Footer -->
    <footer>© 2026 Brand Design. All rights reserved.</footer>
  </body>
</html>
