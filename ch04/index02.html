<!doctype html>

    <title>Document</title>

        box-sizing: border-box;
      }

        width: 100%;
        font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;

        transition: transform 0.2s;

      .card1 img {
        width: 100%;
        display: block;
