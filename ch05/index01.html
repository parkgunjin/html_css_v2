<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NERFLEX 클론 코딩</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      /* 1단계: 리셋 / 전역 스타일 */
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #141414;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }
      /* 컴포넌트 별 2~4 단계 반복 */

      /* header 영역 상단 (네비게이션) */
      /* 2단계: 레이아웃 */
      .navbar {
        display: flex;
        justify-content: space-between;
        padding: 15px 30px;
        background-color: rgba(0, 0, 0, 0.8);
      }
      /* 3단계: 컴포넌트 스타일 */
      .logo {
        color: #e50a12;
        font-size: 28px;
      }
      .navbar nav a {
        text-decoration: none;
        color: #ccc;
        margin-left: 20px;
        transition: color 0.5s ease;
      }
      /* 4단계: 세부조정 */
      .navbar nav a:hover {
        color: #fff;
      }
      /* hero 영역 (메인배너) */
      .hero {
        height: 60vh;
        display: flex;
        align-items: flex-end;
        padding: 60px 30px;
        /* 레이어 1 linear-gradient 
         -그라디언트 : 둘 이상의 색상이 경계선 없이 자연스럽게 점진적으로 변화하는 효과를 의미한다.
         url (...)이미지,
         center,이미지를 중심을 중앙 영역에 배치
         cover 비율 유지하며 영역에 꽉 채움(넘치면 잘림)*/

        background:
          linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.8)),
          url(https://picsum.photos/seed/moviel/1700/600) center/cover;

        /* 3단계: 컴포넌트 스타일 */
      }
      .hero h2 {
        font-size: 48px;
        margin-bottom: 15px;
      }
      .hero p {
        font-size: 18px;
        color: #ccc;
        margin-bottom: 20px;
      }
      .btn-play,
      .btn-info {
        padding: 10px 25px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-right: 10px;
      }
      /* 가로 스크롤 영화 리스트 */
      .movie-row {
        padding: 30px;
      }
      .movle-list {
        display: flex;
        /* 넘치면 가로 스크롤 툴바 생성 
        auto: 내용이 넘칠 때만 스크롤바 표시됨 (일반적)
        scroll: 내용이 없어도 항상 스크롤바 표시됨*/
        overflow-x: auto;
        gap: 10px;
        /* 넘치는 부분은 그냥 잘려나감 : 대신 스크롤 불가 */
        overflow-y: hidden;
        padding: 15px 0;
      }
      .movie-row h2 {
        font-size: 22px;
      }
      .movle-list img {
        width: 150px;
        flex-shrink: 0;
        border-radius: 5px;
        transition: transform 0.3s ease;
        /* 부드러운 변환 준비 */
      }
      .movle-list img:hover {
        transform: scale(1.1);
        box-shadow: 0, 0, 0, 0.8;
      }
      /* footer 영역 (하단) */
      footer {
        padding: 20px 30px;
        color: #ccc;
      }
      /* 전체 반응형 처리 */
      @media (max-widht: 768px) {
        .navbar {
          flex-direction: column;
          gap: 10px;
          padding: 15px 20px;
        }
      }
    </style>
  </head>
  <body>
    <header class="navbar">
      <h1 class="logo">NERFLEX</h1>
      <nav>
        <a href="#">홈</a>
        <a href="#">시리즈</a>
        <a href="#">영화</a>
        <a href="#">NEW</a>
      </nav>
    </header>
    <main>
      <section class="hero">
        <div class="hero-content">
          <h2>오징어 게임 시즌4</h2>
          <p>전 세계를 사로잡은 서바이벌 게임이 돌아왔다</p>
          <div>
            <button class="btn-play">재생</button>
            <button class="btn-info">상세정보</button>
          </div>
        </div>
      </section>
      <section class="movie-row">
        <h2>지금 뜨는 콘텐츠</h2>
        <div class="movle-list">
          <img src="https://picsum.photos/seed/moviel1/200/300" alt="영화 포스트1" />
          <img src="https://picsum.photos/seed/moviel2/200/300" alt="영화 포스트2" />
          <img src="https://picsum.photos/seed/moviel3/200/300" alt="영화 포스트3" />
          <img src="https://picsum.photos/seed/moviel4/200/300" alt="영화 포스트4" />
          <img src="https://picsum.photos/seed/moviel5/200/300" alt="영화 포스트5" />
          <img src="https://picsum.photos/seed/moviel6/200/300" alt="영화 포스트6" />
          <img src="https://picsum.photos/seed/moviel7/200/300" alt="영화 포스트7" />
          <img src="https://picsum.photos/seed/moviel8/200/300" alt="영화 포스트8" />
          <img src="https://picsum.photos/seed/moviel9/200/300" alt="영화 포스트9" />
          <img src="https://picsum.photos/seed/moviel10/200/300" alt="영화 포스트10" />
          <img src="https://picsum.photos/seed/moviel11/200/300" alt="영화 포스트11" />
          <img src="https://picsum.photos/seed/moviel12/200/300" alt="영화 포스트12" />
          <img src="https://picsum.photos/seed/moviel13/200/300" alt="영화 포스트13" />
          <img src="https://picsum.photos/seed/moviel14/200/300" alt="영화 포스트14" />
          <img src="https://picsum.photos/seed/moviel16/200/300" alt="영화 포스트15" />
        </div>
      </section>
      <footer>
        <p>clone coding practice</p>
      </footer>
    </main>
    <footer></footer>
  </body>
</html>
